<app-header [mobileMenuOpen]="isMobileMenuOpen()" (menuRequested)="openMobileMenu()"></app-header>

@if (isMobileMenuOpen()) {
  <div class="landing-mobile-menu-backdrop" (click)="closeMobileMenu()">
    <aside
      id="mobile-menu"
      class="landing-mobile-menu-panel"
      aria-label="Mobile navigation"
      aria-modal="true"
      role="dialog"
      (click)="$event.stopPropagation()"
    >
      <app-mobile-menu (navigateRequested)="closeMobileMenu()"></app-mobile-menu>
    </aside>
  </div>
}

<main>
  <app-hero [heroImageUrl]="currentPageCustomization().heroImageUrl"></app-hero>
  <app-features></app-features>
  <app-samples></app-samples>
  <app-testimonials></app-testimonials>
  <app-pricing></app-pricing>
  <app-footer></app-footer>
</main>
