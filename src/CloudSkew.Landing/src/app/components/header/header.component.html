<div class="cs-background-primary">
  <div class="cs-section-smaller" id="header">
    <div class="header">
      <div class="header-branding">
        <a class="header-branding-logo" aria-label="CloudSkew home" href="/">
          <img
            [src]="externalUrls.brandingLogoUrl"
            alt="CloudSkew"
            height="50"
            title="CloudSkew"
            width="50"
          >
        </a>

        <span class="cs-font-branding">CloudSkew</span>
      </div>

      <nav class="header-nav" aria-label="Primary navigation">
        <a class="header-nav-link cs-font-secondary-content" href="#samples">Samples</a>
        <a class="header-nav-link cs-font-secondary-content" href="#testimonials">Testimonials</a>
        <a class="header-nav-link cs-font-secondary-content" href="#pricing">Pricing</a>
        <a class="header-nav-link cs-font-secondary-content" [href]="externalUrls.docsUrl" rel="noopener noreferrer" target="_blank">Docs</a>
        <a class="header-nav-link cs-font-secondary-content" [href]="externalUrls.blogUrl" rel="noopener noreferrer" target="_blank">Blog</a>
        <a class="header-nav-link cs-font-secondary-content" [href]="externalUrls.statusUrl" rel="noopener noreferrer" target="_blank">Status</a>
        <a class="header-nav-link cs-font-secondary-content header-cta-button" [href]="externalUrls.appUrl" rel="noopener noreferrer" target="_blank">Go To App</a>
      </nav>

      <button
        type="button"
        class="header-hamburger"
        aria-controls="mobile-menu"
        aria-label="Open mobile menu"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="menuRequested.emit()"
      >
        <img src="/assets/hamburger-icon.svg" alt="" aria-hidden="true" height="50" width="50">
      </button>
    </div>
  </div>
</div>
