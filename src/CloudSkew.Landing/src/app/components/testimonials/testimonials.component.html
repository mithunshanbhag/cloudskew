<div class="cs-background-primary-dark">
  <section class="cs-section" id="testimonials">
    <h2 class="cs-section-title">What users are saying</h2>

    <div class="testimonials-flexbox">
      @for (testimonialItem of testimonialItems; track testimonialItem.liveUrl) {
        <div class="testimonials-card">
          <a class="testimonials-card-quote" [href]="testimonialItem.liveUrl" rel="noopener noreferrer" target="_blank">
            <div class="cs-font-quote">{{ testimonialItem.testimonial }}</div>
          </a>

          <div class="testimonials-card-user-flexbox">
            <div class="testimonials-card-user-details">
              <div class="testimonials-card-user-details-name cs-font-primary-content">{{ testimonialItem.name }}</div>
              <div class="testimonials-card-user-details-job cs-font-secondary-content">{{ testimonialItem.job }}</div>
            </div>

            <img
              class="testimonials-card-user-artwork"
              [src]="testimonialItem.artwork"
              alt=""
              aria-hidden="true"
              height="48"
              width="48"
            >
          </div>
        </div>
      }
    </div>
  </section>
</div>
