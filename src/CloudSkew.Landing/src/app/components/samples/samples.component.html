<div class="cs-background-primary">
    <div class="cs-section" id="samples">

        <!-- section title -->
        <span class="cs-section-title">Check out some samples</span>

        <div class="samples-gallery">
            <!-- gallery item -->
            <div class="samples-gallery-item" *ngFor="let galleryItem of galleryItems">

                <!-- header -->
                <div class="samples-gallery-item-header">
                    <!-- title -->
                    <span class="samples-gallery-item-header-title cs-font-quote">{{galleryItem.title}}</span>
                    <!-- share link -->
                    <a class="samples-gallery-item-header-sharelink" [href]="galleryItem.shareUrl" target="_blank"
                        rel="noopener noreferrer">See Live</a>
                </div>

                <!-- description -->
                <span
                    class="samples-gallery-item-description cs-font-secondary-content">{{galleryItem.description}}</span>

                <!-- image -->
                <a class="samples-gallery-item-image" [href]="galleryItem.imgUrl" target="_blank"
                    rel="noopener noreferrer">
                    <img [src]="galleryItem.thumbnailUrl" [title]="galleryItem.description"
                        [alt]="galleryItem.description" loading="lazy">
                </a>

            </div>
        </div>

    </div>
</div>
