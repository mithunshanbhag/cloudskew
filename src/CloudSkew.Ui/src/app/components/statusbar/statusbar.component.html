<div class="status-bar-content">
  @if (this.userProfile) {
    <div class="subscription-details">
      @switch (userProfile.subscriptionName.toLowerCase()) {
        @case ('free') {
          <button mat-button (click)="this.onSubscriptionTierUpgradeButtonClick()">UPGRADE TO
          PROFESSIONAL PLAN</button>
        }
        @case ('earlyadopter') {
          <button mat-button
          (click)="this.onSubscriptionTierUpgradeButtonClick()">UPGRADE TO PROFESSIONAL PLAN</button>
        }
        @default {
          <button mat-button matTooltip="see billing & subscription details"
          (click)="this.onSubscriptionTierChangeButtonClick()">SUBSCRIPTION: PROFESSIONAL PLAN</button>
        }
      }
    </div>
    <div class="user-profile-details">
      <span class="user-profile-text">{{userProfile.email|lowercase}}
      </span>
    </div>
  }
  @if (this.tool) {
    <div>mode: {{this.tool}}</div>
  }
  @if (this.zoomPercentage) {
    <div class="zoom-details">zoom: {{this.zoomPercentage|percent}}</div>
  }
</div>
