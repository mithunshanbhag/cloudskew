<div class="status-bar-content">
  @if (this.userProfile) {
    <div class="user-profile-details">
      <span class="user-profile-text">{{userProfile.email|lowercase}}
      </span>
    </div>
  }
  @if (this.tool) {
    <div>mode: {{this.tool}}</div>
  }
  @if (this.zoomPercentage) {
    <div class="zoom-details">zoom: {{this.zoomPercentage|percent}}</div>
  }
</div>
