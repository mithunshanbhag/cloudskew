<span mat-dialog-title class="windowHeaderText">Create Diagram From Template</span>

<mat-dialog-content>
    <div class="windowContent">
        <span>Are you sure?</span>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="defaultFlexbox">
    <button mat-stroked-button [mat-dialog-close]="this.templateCompactDTO">CREATE</button>
    <button mat-stroked-button mat-dialog-close>CANCEL</button>
</div>
