<span mat-dialog-title class="windowHeaderText">{{this.data.title}}</span>

<mat-dialog-content>
    <div class="windowContent">
        <span>{{this.data.message}}</span>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="defaultFlexbox">
    <button mat-stroked-button color="warn" [mat-dialog-close]="true">REPLACE</button>
    <button mat-stroked-button mat-dialog-close>CANCEL</button>
</div>
