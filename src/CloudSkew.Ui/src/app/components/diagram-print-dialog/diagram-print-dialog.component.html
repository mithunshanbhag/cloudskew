<span mat-dialog-title class="windowHeaderText">Print Diagram</span>

<mat-dialog-content>
    <div class="windowContent">
        <span>Please ensure that your browser settings allow pop-ups from this site.</span>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="defaultFlexbox">
    <button mat-stroked-button [mat-dialog-close]="this.diagram">PRINT</button>
    <button mat-stroked-button mat-dialog-close>CANCEL</button>
</div>
