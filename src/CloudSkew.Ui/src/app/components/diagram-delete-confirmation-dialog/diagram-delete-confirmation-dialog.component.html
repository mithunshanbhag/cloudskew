<span mat-dialog-title class="windowHeaderText">Reset Diagram</span>

<mat-dialog-content>
    <div class="windowContent">
        <span>This will replace the current diagram with a new blank diagram. This cannot be undone.</span>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="defaultFlexbox">
    <button mat-stroked-button color="warn" [mat-dialog-close]="true">RESET</button>
    <button mat-stroked-button mat-dialog-close>CANCEL</button>
</div>
