<span mat-dialog-title class="windowHeaderText">Delete Template</span>

<mat-dialog-content>
    <div class="windowContent">
        <span>Are you sure? This cannot be undone!</span>
    </div>
</mat-dialog-content>

<div mat-dialog-actions class="defaultFlexbox">
    <button mat-stroked-button color="warn" [mat-dialog-close]="this.templateCompactDTO">DELETE</button>
    <button mat-stroked-button mat-dialog-close>CANCEL</button>
</div>
