<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudSkew UI Dialog Mockup - Confirmation</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="mockup-shell">
    <div class="dialog-backdrop"></div>

    <section class="dialog" aria-label="Reset Diagram">
      <div class="dialog-header">
        <h1>Reset Diagram</h1>
      </div>

      <div class="dialog-body">
        <p>This will replace the current diagram with a new blank diagram. This cannot be undone.</p>
      </div>

      <footer class="dialog-footer">
        <button class="button button--danger" type="button">RESET</button>
        <button class="button button--secondary" type="button">CANCEL</button>
      </footer>
    </section>
  </main>
</body>
</html>
