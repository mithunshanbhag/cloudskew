<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CloudSkew UI Bottom Status Bar Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="mockup-page">
    <section class="workspace-frame">
      <div class="canvas-surface">
        <div class="canvas-hint">Canvas area placeholder</div>
      </div>

      <footer class="status-bar">
        <div class="status-cluster">
          <div class="status-chip mode-chip">
            <span class="status-dot" aria-hidden="true"></span>
            <span class="chip-label">Mode</span>
            <span class="chip-value">Select</span>
          </div>
        </div>

        <div class="status-spacer" aria-hidden="true"></div>

        <div class="status-cluster status-cluster-end">
          <div class="status-chip">
            <span class="material-symbols-outlined chip-icon" aria-hidden="true">zoom_in</span>
            <span class="chip-label">Zoom</span>
            <span class="chip-value">125%</span>
          </div>
        </div>
      </footer>
    </section>
  </main>
</body>
</html>
