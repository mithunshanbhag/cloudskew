<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CloudSkew UI Dialog Mockup - Add/Remove Symbols</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="mockup-shell">
    <div class="dialog-backdrop"></div>

    <section class="dialog" aria-label="Add/Remove Symbols">
      <div class="dialog-header">
        <h1>Add/Remove Symbols</h1>
      </div>

      <div class="dialog-body">
        <div class="family-group">
          <h2>Cloud providers</h2>
          <label class="checkbox-row">
            <input type="checkbox" checked>
            <span>AWS</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox" checked>
            <span>Azure</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>GCP</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>Oracle</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>Alibaba Cloud</span>
          </label>
        </div>

        <div class="family-group">
          <h2>Platforms and tools</h2>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>Kubernetes / CNCF</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>Elastic</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>HashiCorp</span>
          </label>
          <label class="checkbox-row">
            <input type="checkbox">
            <span>Cloudflare</span>
          </label>
        </div>
      </div>

      <footer class="dialog-footer">
        <button class="button button--secondary" type="button">CLOSE</button>
      </footer>
    </section>
  </main>
</body>
</html>
