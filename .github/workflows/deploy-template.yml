name: cloudskew-deploy-template

on:
  workflow_call:
    inputs:
      environmentName:
        required: true
        type: string
      runProvisioning:
        required: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  APP_NAME_API: cloudskew-aca
  APP_NAME_LANDING_PAGE: cloudskew-landing
  APP_NAME_ASSETS: cloudskew-assets
  APP_NAME_DOCS: cloudskew-docs
  APP_NAME_BLOG: cloudskew-blog
  APP_NAME_UI: cloudskew-ui
  DOTNET_VERSION_10: "10.0.x"
  # Change the package name if you want a different GHCR namespace.
  GHCR_IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cloudskew-api
  GHCR_IMAGE_TAG_UNIQUE: run-${{ github.run_number }}-attempt-${{ github.run_attempt }}
  GHCR_IMAGE_TAG_STABLE: latest
  NODE_VERSION_24: "24.x"
  RESOURCE_GROUP_NAME: cloudskew-rg
  RESOURCE_LOCK_NAME: cloudskew-rg-delete-lock
  # metadata will be stored, and not where the resource groups will be deployed.
  # You can specify any location for `SUB_DEPLOYMENT_REGION`. It's the region where the deployment
  SUB_DEPLOYMENT_REGION: westeurope
  SYNCFUSION_PACKAGE_VERSION: "33.x.x"

jobs:
  provision:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 30
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      # temporarily use az cli to upgrade bicep
      # Context: https://github.com/Azure/bicep/issues/16681#issuecomment-2747568200
      - name: upgrade bicep
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: az bicep upgrade
      #
      # section #1: provisioning the resources on Azure using bicep templates
      #
      # The first step is to create the resource group: `cloudskew-rg`.
      # The below step can also be manually executed as follows:
      # az deployment sub create --location {LOCATION} --template-file .\createResourceGroup.bicep
      # Note: You can specify any location for `{LOCATION}`. It's the region where the deployment metadata will be stored, and not
      # where the resource groups will be deployed.
      # @TODO: The 'azure/arm-deploy' action will soon be deprecated. Move to the 'azure/bicep-deploy' github action.
      - name: create resource group
        uses: Azure/arm-deploy@v2
        if: ${{ inputs.runProvisioning == true }}
        with:
          scope: subscription
          region: ${{ env.SUB_DEPLOYMENT_REGION }}
          template: ./infra/createResourceGroup.bicep
          parameters: rgName=${{ env.RESOURCE_GROUP_NAME }} envName=${{ inputs.environmentName }} githubCommitSha=${{ github.sha }} githubWorkflowRunId=${{ github.run_id }} githubRef=${{ github.ref }}

  build-deploy-cloudskew-landing:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION_24 }}
      - name: install angular cli globally
        run: npm install -g @angular/cli
      - name: install npm packages
        run: npm install
        working-directory: ./src/CloudSkew.Landing
      - name: build cloudskew landing
        run: npm run build
        working-directory: ./src/CloudSkew.Landing
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: get swa deployment token
        id: get-swaDeploymentToken
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: echo "swaDeploymentToken"="$(az staticwebapp secrets list -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.APP_NAME_LANDING_PAGE }} --query properties.apiKey -o tsv)" >> $GITHUB_OUTPUT
      - name: deploy cloudskew ui to swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swaDeploymentToken.outputs.swaDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./src/CloudSkew.Landing/dist/CloudSkew.Landing/browser
          api_location: "" # No API in this app
          output_location: "" # No build step, so output location is same as app location

  build-deploy-cloudskew-ui:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION_24 }}
      - name: install angular cli globally
        run: npm install -g @angular/cli
      - name: install npm packages
        run: npm install
        working-directory: ./src/CloudSkew.Ui
      - name: activate Syncfusion License
        run: npx syncfusion-license activate
        env:
          SYNCFUSION_LICENSE: ${{ secrets.SYNCFUSION_LICENSE_KEY }}
        working-directory: ./src/CloudSkew.Ui
      - name: build cloudskew ui
        run: npm run build-testing
        working-directory: ./src/CloudSkew.Ui
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: get swa deployment token
        id: get-swaDeploymentToken
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: echo "swaDeploymentToken"="$(az staticwebapp secrets list -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.APP_NAME_UI }} --query properties.apiKey -o tsv)" >> $GITHUB_OUTPUT
      - name: deploy cloudskew ui to swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swaDeploymentToken.outputs.swaDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./src/CloudSkew.Ui/dist/cloudskew-ui
          skip_app_build: true
          api_location: "" # No API in this app
          output_location: "" # No build step, so output location is same as app location

  build-deploy-cloudskew-assets:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: get swa deployment token
        id: get-swaDeploymentToken
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: echo "swaDeploymentToken"="$(az staticwebapp secrets list -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.APP_NAME_ASSETS }} --query properties.apiKey -o tsv)" >> $GITHUB_OUTPUT
      - name: deploy cloudskew assets to swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swaDeploymentToken.outputs.swaDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./src/CloudSkew.Assets
          skip_app_build: true
          api_location: "" # No API in this app
          output_location: "" # No build step, so output location is same as app location

  build-deploy-cloudskew-docs:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION_24 }}
      - name: install npm packages
        run: npm ci
        working-directory: ./docs/user-manual
      - name: build cloudskew docs
        run: npm run docs:build
        working-directory: ./docs/user-manual
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: get swa deployment token
        id: get-swaDeploymentToken
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: echo "swaDeploymentToken"="$(az staticwebapp secrets list -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.APP_NAME_DOCS }} --query properties.apiKey -o tsv)" >> $GITHUB_OUTPUT
      - name: deploy cloudskew docs to swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swaDeploymentToken.outputs.swaDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./docs/user-manual/.vuepress/dist
          skip_app_build: true
          api_location: "" # No API in this app
          output_location: "" # No build step, so output location is same as app location

  build-deploy-cloudskew-blog:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: setup node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION_24 }}
      - name: install npm packages
        run: npm ci
        working-directory: ./docs/blog
      - name: build cloudskew blog
        run: npm run docs:build
        working-directory: ./docs/blog
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: get swa deployment token
        id: get-swaDeploymentToken
        uses: azure/CLI@v2.2.0
        with:
          inlineScript: echo "swaDeploymentToken"="$(az staticwebapp secrets list -g ${{ env.RESOURCE_GROUP_NAME }} -n ${{ env.APP_NAME_BLOG }} --query properties.apiKey -o tsv)" >> $GITHUB_OUTPUT
      - name: deploy cloudskew blog to swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-swaDeploymentToken.outputs.swaDeploymentToken }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ./docs/blog/.vuepress/dist
          skip_app_build: true
          api_location: "" # No API in this app
          output_location: "" # No build step, so output location is same as app location

  build-deploy-cloudskew-api:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environmentName }}
    timeout-minutes: 10
    needs: provision
    steps:
      - name: checkout code
        uses: actions/checkout@v4.1.1
      - name: unzip syncfusion license key validator
        run: unzip ./LicenseKeyValidator.zip -d ./LicenseKeyValidator
      - name: enable permissions for syncfusion license key validator
        run: chmod +x ./LicenseKeyValidator/*
      - name: run syncfusion license key validator
        run: ./LicenseKeyValidator/LicenseKeyValidatorConsole.exe /platform:"PDF" /version:"${{ env.SYNCFUSION_PACKAGE_VERSION }}" /licensekey:"${{ secrets.SYNCFUSION_LICENSE_KEY }}"
      - name: set up docker buildx
        uses: docker/setup-buildx-action@v3
      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: build and push api image
        uses: docker/build-push-action@v6
        with:
          context: ./src/CloudSkew.Api
          file: ./src/CloudSkew.Api/Dockerfile
          push: true
          tags: |
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.GHCR_IMAGE_TAG_UNIQUE }}
            ${{ env.GHCR_IMAGE_NAME }}:${{ env.GHCR_IMAGE_TAG_STABLE }}
      - name: azure login
        uses: azure/login@v2.2.0
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: deploy to aca
        uses: azure/CLI@v1
        with:
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az containerapp update -n ${{ env.APP_NAME_API }} -g ${{ env.RESOURCE_GROUP_NAME }} --image ${{ env.GHCR_IMAGE_NAME }}:${{ env.GHCR_IMAGE_TAG_UNIQUE }}
